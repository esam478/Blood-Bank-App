<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بنك الدم</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e01b22">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background: #e01b22; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🩸 بنك الدم</h1>
        <p>مرحباً بك في تطبيق إدارة المتبرعين بالدم.</p>
        <a href="#" class="btn">البحث عن متبرع</a>
    </div>

    <script>
        // كود تفعيل العمل بدون إنترنت والتثبيت
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
